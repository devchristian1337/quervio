[workspace]
resolver = "3"
members = ["src-tauri", "crates/querydeck-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
querydeck-core = { path = "crates/querydeck-core" }
# Pinned exactly: 0.x API, see docs/adr/0002-driver-mssql-tds.md
mssql-tds = "=0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
