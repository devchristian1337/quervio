[workspace]
resolver = "3"
members = ["src-tauri", "crates/quervio-core"]

[workspace.package]
version = "0.1.13"
edition = "2024"

[workspace.dependencies]
quervio-core = { path = "crates/quervio-core" }
# Pinned exactly: 0.x API, see docs/adr/0002-driver-mssql-tds.md
mssql-tds = "=0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Registry", "Win32_System_Threading"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
encoding_rs = "0.8"
roxmltree = "0.21"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
