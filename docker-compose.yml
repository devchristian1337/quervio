# SQL Server used by the quervio-core integration tests.
# Start with: docker compose up -d
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Named after the app's first name, Querydeck. Renaming it would recreate
    # the container, and it has no volume: its databases would be lost.
    container_name: querydeck-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${QUERVIO_TEST_PASSWORD}
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
