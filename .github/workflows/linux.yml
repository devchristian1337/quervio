name: Linux packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release tag to build and upload (empty: validate main only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Validate release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node -e '
            const fs = require("fs");
            const expected = process.env.RELEASE_TAG.slice(1);
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8")).version;
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargo = fs.readFileSync("Cargo.toml", "utf8").match(/\[workspace\.package\][\s\S]*?^version\s*=\s*"([^"]+)"/m)?.[1];
            const lock = fs.readFileSync("Cargo.lock", "utf8");
            const lockQuervio = lock.match(/name = "quervio"\r?\nversion = "([^"]+)"/)?.[1];
            const lockCore = lock.match(/name = "quervio-core"\r?\nversion = "([^"]+)"/)?.[1];
            for (const [label, actual] of [
              ["package.json", pkg],
              ["src-tauri/tauri.conf.json", tauri],
              ["Cargo.toml", cargo],
              ["Cargo.lock (quervio)", lockQuervio],
              ["Cargo.lock (quervio-core)", lockCore],
            ]) {
              if (actual !== expected) {
                console.error(`Version mismatch in ${label}: expected ${expected}, found ${actual}`);
                process.exit(1);
              }
            }
          '
      - name: Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libkrb5-dev libicu-dev libsecret-1-0 libodbc2 gnome-keyring dbus-x11 xvfb xauth webkit2gtk-driver squashfs-tools flatpak flatpak-builder
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.22.0'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Flatpak runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Backend tests
        run: cargo test --locked --workspace
      - name: Linux keyring integration
        run: bash scripts/test-linux-keyring.sh
      - name: Frontend tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Build Linux packages and self-test the bridge
        run: bash scripts/pack-linux.sh --flatpak
      - name: Native packaged application smoke test
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          bash scripts/test-linux-native.sh
      - name: Native Flatpak smoke test
        run: |
          version=$(node -p "require('./package.json').version")
          flatpak install --user --noninteractive -y "target/flatpak/Quervio_${version}_$(uname -m).flatpak"
          QUERVIO_NATIVE_FORMAT=flatpak bash scripts/test-linux-native.sh
      - name: Stage public packages and checksums
        run: bash scripts/stage-linux-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Quervio-linux-release-${{ matrix.arch }}
          compression-level: 0
          path: |
            target/linux-release/Quervio-linux-${{ matrix.arch }}.*
            target/linux-release/SHA256SUMS-linux-${{ matrix.arch }}.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Quervio-linux-validation-${{ matrix.arch }}
          path: target/linux-smoke/
          if-no-files-found: ignore

  upload:
    if: inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Quervio-linux-release-*
          path: linux-assets
          merge-multiple: true
      - name: Upload verified Linux packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          cd linux-assets
          sha256sum -c SHA256SUMS-linux-x64.txt
          sha256sum -c SHA256SUMS-linux-arm64.txt
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
